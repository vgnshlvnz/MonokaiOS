# Builds the live ISO with mkiso.sh and publishes it on the repo's Releases tab.
#  - Push a tag like v1.0.0        → release "v1.0.0"
#  - Actions → Build ISO → Run     → release with the version you type, or vYYYY.MM.DD-<run> if empty
#  - Push to main (mkiso.sh etc.)  → release vYYYY.MM.DD-<run>
# The ISO is split into <2 GB parts because GitHub limits each release file to 2 GB.
name: Build ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.2.0 (empty = vYYYY.MM.DD-<run number>)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - mkiso.sh
      - src/**
      - keys/**
      - .github/workflows/build-iso.yml
    tags: ['v*']

permissions:
  contents: write          # needed to create releases

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space (build needs ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      # Only the downloaded .deb files are cached. live-build's bootstrap snapshot
      # (cache/bootstrap) is a root filesystem and breaks if restored by a non-root user.
      - name: Restore apt package cache
        uses: actions/cache@v4
        with:
          path: |
            iso-build/cache/packages.bootstrap
            iso-build/cache/packages.chroot
            iso-build/cache/packages.binary
          key: lb-pkgs-v2-${{ hashFiles('mkiso.sh') }}
          restore-keys: lb-pkgs-v2-

      - name: Remove stale live-build state (must be created fresh, as root)
        run: |
          if git ls-files --error-unmatch iso-build >/dev/null 2>&1; then
            echo "::warning::iso-build/ is committed to the repo — remove it (git rm -r --cached iso-build) and add it to .gitignore"
          fi
          sudo rm -rf iso-build/cache/bootstrap iso-build/chroot iso-build/binary iso-build/.build iso-build/config

      - name: Build ISO
        env:
          USER_PASS: ${{ secrets.USER_PASS }}
        run: |
          [ -n "$USER_PASS" ] || { echo "::error::Set the USER_PASS repository secret"; exit 1; }
          chmod +x mkiso.sh
          sudo -E ./mkiso.sh

      - name: Make cached packages and the ISO readable
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" iso-build/cache/packages.* ./netlive-*.iso* 2>/dev/null || true

      - name: Prepare release files
        id: iso
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          src="$(find . -maxdepth 1 -name 'netlive-*.iso' -printf '%T@ %f\n' | sort -nr | head -n1 | cut -d' ' -f2)"
          [ -f "$src" ] || { echo "::error::No ISO produced"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_VERSION}" ]; then tag="${INPUT_VERSION}"
          else tag="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"; fi
          iso="netlive-${tag}-amd64.iso"
          mv "$src" "$iso"
          sha256sum "$iso" > "$iso.sha256"
          split -b 1900M -d -a 2 "$iso" "$iso.part"
          { echo "tag=$tag"; echo "iso=$iso"; } >> "$GITHUB_OUTPUT"
          ls -lh ./netlive-*

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.iso.outputs.tag }}
          name: Netlive ${{ steps.iso.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || false }}
          make_latest: ${{ !(inputs.prerelease || false) }}
          files: |
            ${{ steps.iso.outputs.iso }}.part*
            ${{ steps.iso.outputs.iso }}.sha256
          body: |
            Built from ${{ github.sha }} on ${{ github.ref_name }}.

            **Download all `.part` files and the `.sha256`, then join and verify:**
            ```bash
            cat ${{ steps.iso.outputs.iso }}.part* > ${{ steps.iso.outputs.iso }}
            sha256sum -c ${{ steps.iso.outputs.iso }}.sha256
            ```
            Windows (PowerShell): `cmd /c copy /b ${{ steps.iso.outputs.iso }}.part00+${{ steps.iso.outputs.iso }}.part01 ${{ steps.iso.outputs.iso }}`
